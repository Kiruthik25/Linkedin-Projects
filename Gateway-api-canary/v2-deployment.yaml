apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-v2
  namespace: gateway-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo
      version: v2

  template:
    metadata:
      labels:
        app: demo
        version: v2

    spec:
      containers:
        - name: app
          image: kiruthik067/canary-demo:1.0

          env:
            - name: VERSION
              value: "v2"

          ports:
            - name: http
              containerPort: 8080