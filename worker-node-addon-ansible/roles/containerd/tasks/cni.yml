---
# 6. Install CNI plugin
- name: Ensure /opt/cni/bin exists
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Check if CNI plugins already present
  ansible.builtin.stat:
    path: /opt/cni/bin/bridge
  register: cni_bridge_bin

- name: Download CNI plugins tarball
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ cni_plugins_arch }}-v{{ cni_plugins_version }}.tgz"
    dest: "{{ download_dir }}/cni-plugins-linux-{{ cni_plugins_arch }}-v{{ cni_plugins_version }}.tgz"
    mode: "0644"
  when: not cni_bridge_bin.stat.exists

- name: Extract CNI plugins into /opt/cni/bin
  ansible.builtin.unarchive:
    src: "{{ download_dir }}/cni-plugins-linux-{{ cni_plugins_arch }}-v{{ cni_plugins_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: true
  when: not cni_bridge_bin.stat.exists
