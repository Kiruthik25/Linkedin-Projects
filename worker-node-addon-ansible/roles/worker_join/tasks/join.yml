---
# This role assumes a control-plane node has already been initialized
# with `kubeadm init` on the host(s) in the [masters] group, and that
# the ansible user has passwordless sudo / kubeconfig access there.

- name: Check whether this node has already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Generate a fresh join command on the first master
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  delegate_to: "{{ groups['masters'][0] }}"
  when: not kubelet_conf.stat.exists

- name: Run kubeadm join on the worker
  ansible.builtin.command: "{{ join_command_raw.stdout }}"
  when:
    - not kubelet_conf.stat.exists
    - join_command_raw is not skipped

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started

- name: Confirm node joined successfully
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf_after
  failed_when: not kubelet_conf_after.stat.exists
