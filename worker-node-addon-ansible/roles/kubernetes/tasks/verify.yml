---
- name: Get kubeadm version
  ansible.builtin.command: kubeadm version
  register: kubeadm_version_out
  changed_when: false

- name: Get kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_version_out
  changed_when: false

- name: Get kubectl client version
  ansible.builtin.command: kubectl version --client
  register: kubectl_version_out
  changed_when: false

- name: Show installed Kubernetes tooling versions
  ansible.builtin.debug:
    msg:
      - "{{ kubeadm_version_out.stdout }}"
      - "{{ kubelet_version_out.stdout }}"
      - "{{ kubectl_version_out.stdout }}"
