apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-app-demo
  labels:
    app: maven-app-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maven-app-demo
  template:
    metadata:
      labels:
        app: maven-app-demo
    spec:
      containers:
        - name: maven-app-demo
          image: kiruthik067/maveen-demo:latest   # updated by CI with build tag
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: maven-app-demo-svc
spec:
  type: ClusterIP
  selector:
    app: maven-app-demo-demo
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
