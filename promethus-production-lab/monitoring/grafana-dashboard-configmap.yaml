apiVersion: v1
kind: ConfigMap
metadata:
  name: app-observability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  app-observability.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "service:http_requests:rate5m",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx Error Ratio",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "service:http_5xx_ratio:rate5m * 100",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "p95 Latency",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "service:http_request_duration_p95:5m",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Pod Restarts",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"apps\"}[15m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["prometheus", "kubernetes", "sre"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "title": "Application Observability",
      "uid": "app-observability"
    }
